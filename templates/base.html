<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}K-Cal{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ asset_version }}" />
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-dot"></span>
      <a href="/">K-Cal</a>
      <span style="font-size:11px;color:#94A3B8;margin-left:10px;font-weight:500;">build {{ asset_version }}</span>
    </div>
    <nav>
      <a href="/">Calendar</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Comb-brush sound on rainbow-logo click: ~36 filtered-noise ticks
    // ramping from fast to slow, like a finger losing momentum across teeth.
    (function () {
      const dot = document.querySelector('.brand-dot');
      if (!dot) return;
      dot.style.cursor = 'pointer';
      dot.setAttribute('role', 'button');
      dot.setAttribute('aria-label', 'Comb brush');
      let ctx, noiseBuf;
      function ensureCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.012), ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          noiseBuf = buf;
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      function tick(c, when, gain) {
        const src = c.createBufferSource();
        src.buffer = noiseBuf;
        const filt = c.createBiquadFilter();
        filt.type = 'bandpass';
        filt.frequency.value = 2200 + Math.random() * 1200;
        filt.Q.value = 6;
        const g = c.createGain();
        g.gain.setValueAtTime(0, when);
        g.gain.linearRampToValueAtTime(gain, when + 0.0004);
        g.gain.exponentialRampToValueAtTime(0.0001, when + 0.009);
        src.connect(filt).connect(g).connect(c.destination);
        src.start(when);
        src.stop(when + 0.014);
      }
      dot.addEventListener('click', (e) => {
        e.preventDefault();
        const c = ensureCtx();
        if (!c) return;
        const N = 36;
        let t = c.currentTime + 0.01;
        for (let i = 0; i < N; i++) {
          const progress = i / N;
          const dt = 0.009 + progress * 0.014 + Math.random() * 0.003;
          const gain = 0.22 + Math.random() * 0.10;
          tick(c, t, gain);
          t += dt;
        }
      });
    })();
  </script>
</body>
</html>
