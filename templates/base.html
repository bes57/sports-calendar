<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}K-Cal{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ asset_version }}" />
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-dot"></span>
      <a href="/">K-Cal</a>
      <span style="font-size:11px;color:#94A3B8;margin-left:10px;font-weight:500;">build {{ asset_version }}</span>
    </div>
    <nav>
      <a href="/">Calendar</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Rapid plastic-button-click burst on rainbow-logo click: each click is
    // a bandpassed noise transient + brief square-wave body, both very
    // tight (~12 ms total) so it reads as a hard click, not a resonant tap.
    (function () {
      const dot = document.querySelector('.brand-dot');
      if (!dot) return;
      dot.style.cursor = 'pointer';
      dot.setAttribute('role', 'button');
      dot.setAttribute('aria-label', 'Click');
      let ctx, noiseBuf;
      function ensureCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.006), ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          noiseBuf = buf;
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      function clk(c, when, gain) {
        // Layer 1 — HF noise "snap": the sharp attack transient.
        const nSrc = c.createBufferSource();
        nSrc.buffer = noiseBuf;
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 3600;
        bp.Q.value = 8;
        const nG = c.createGain();
        nG.gain.setValueAtTime(gain * 0.85, when);
        nG.gain.exponentialRampToValueAtTime(0.0001, when + 0.008);
        nSrc.connect(bp).connect(nG).connect(c.destination);
        nSrc.start(when);
        nSrc.stop(when + 0.010);
        // Layer 2 — pitched mid square: the button "click" character.
        const sq = c.createOscillator();
        sq.type = 'square';
        sq.frequency.value = 1100;
        const sqG = c.createGain();
        sqG.gain.setValueAtTime(0, when);
        sqG.gain.linearRampToValueAtTime(gain * 0.28, when + 0.0005);
        sqG.gain.exponentialRampToValueAtTime(0.0001, when + 0.014);
        sq.connect(sqG).connect(c.destination);
        sq.start(when);
        sq.stop(when + 0.016);
        // Layer 3 — sub thump with quick pitch drop: the "tok" body weight.
        const sub = c.createOscillator();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(190, when);
        sub.frequency.exponentialRampToValueAtTime(85, when + 0.022);
        const subG = c.createGain();
        subG.gain.setValueAtTime(0, when);
        subG.gain.linearRampToValueAtTime(gain * 0.55, when + 0.0008);
        subG.gain.exponentialRampToValueAtTime(0.0001, when + 0.030);
        sub.connect(subG).connect(c.destination);
        sub.start(when);
        sub.stop(when + 0.035);
      }
      dot.addEventListener('click', (e) => {
        e.preventDefault();
        const c = ensureCtx();
        if (!c) return;
        // Asymmetric timing: short ease-out wind-up to peak, then long
        // geometric tail so deceleration is gradual and the stop is gentle.
        //   Wind-up: 6 clicks, ease-out from startSpacing → minSpacing.
        //   Tail:   24 clicks, spacing grows by tailGrowth each click.
        const WIND_UP = 6;
        const TAIL = 24;
        const N = WIND_UP + TAIL;
        const startSpacing = 0.075;  // ~13 clicks/sec at the very start
        const minSpacing = 0.013;    // ~77 clicks/sec at the peak
        const tailGrowth = 1.095;    // each tail gap ~9.5% longer than the last
        let t = c.currentTime + 0.01;
        const startT = t;
        const offsets = [0];
        for (let i = 0; i < N; i++) {
          clk(c, t, 0.30);
          let dt;
          if (i < WIND_UP) {
            const p = i / (WIND_UP - 1);          // 0..1 across wind-up
            const ease = 1 - Math.pow(1 - p, 2);  // ease-out quad
            dt = startSpacing - (startSpacing - minSpacing) * ease;
          } else {
            const tailIdx = i - WIND_UP;          // 0 at first tail click
            dt = minSpacing * Math.pow(tailGrowth, tailIdx);
          }
          t += dt;
          offsets.push(t - startT);
        }
        // Spin the dot in lockstep with the clicks — each click advances
        // the rotation one fixed notch, so the spin's velocity curve mirrors
        // the click-rate curve: quick wind-up, blur at peak, long coast-out.
        const totalSec = offsets[offsets.length - 1];
        const TOTAL_DEG = 1800;  // 5 rotations
        const stepDeg = TOTAL_DEG / N;
        const keyframes = offsets.map((off, i) => ({
          offset: off / totalSec,
          transform: `rotate(${i * stepDeg}deg)`,
        }));
        dot.getAnimations().forEach(a => a.cancel());
        dot.animate(keyframes, { duration: totalSec * 1000, easing: 'linear', fill: 'none' });
      });
    })();
  </script>
</body>
</html>
